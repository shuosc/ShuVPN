name: Flutter CI
'on':
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect code changes
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            compare_base="$BASE_SHA"
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            compare_base="$BEFORE_SHA"
          elif git rev-parse HEAD^ >/dev/null 2>&1; then
            compare_base="HEAD^"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! git cat-file -e "$compare_base^{commit}" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          code_changed=false
          while IFS= read -r file; do
            case "$file" in
              *.md|LICENSE|LICENSE.*|.github/ISSUE_TEMPLATE/*|.github/pull_request_template.md)
                ;;
              *)
                code_changed=true
                break
                ;;
            esac
          done < <(git diff --name-only "$compare_base" HEAD)

          echo "code=$code_changed" >> "$GITHUB_OUTPUT"
  android:
    name: Android (${{ matrix.architecture }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - universal
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart and Flutter code
        run: flutter analyze
      - name: Run tests
        run: flutter test --concurrency=1
      - name: Build and validate architecture
        shell: pwsh
        run: ./scripts/build_android.ps1 -Architecture "${{ matrix.architecture }}"
      - name: Upload architecture build
        uses: actions/upload-artifact@v7
        with:
          name: ci-android-${{ matrix.architecture }}-${{ github.sha }}
          path: build/release/*.apk
          if-no-files-found: error
          retention-days: 14
  windows:
    name: Windows (${{ matrix.architecture }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-latest
          - architecture: arm64
            runner: windows-11-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart and Flutter code
        run: flutter analyze
      - name: Run tests
        run: flutter test --concurrency=1
      - name: Build and validate architecture
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Architecture "${{ matrix.architecture }}"
      - name: Upload architecture build
        uses: actions/upload-artifact@v7
        with:
          name: ci-windows-${{ matrix.architecture }}-${{ github.sha }}
          path: build/release/*.zip
          if-no-files-found: error
          retention-days: 14
  required:
    name: CI required
    if: always()
    needs:
      - changes
      - android
      - windows
    runs-on: ubuntu-latest
    steps:
      - name: Require every platform and architecture
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          ANDROID_RESULT: ${{ needs.android.result }}
          WINDOWS_RESULT: ${{ needs.windows.result }}
        run: |
          set -euo pipefail
          test "$CHANGES_RESULT" = success
          if [[ "$CODE" == true ]]; then
            test "$ANDROID_RESULT" = success
            test "$WINDOWS_RESULT" = success
          else
            test "$ANDROID_RESULT" = skipped
            test "$WINDOWS_RESULT" = skipped
          fi
