name: Android Release
'on':
  workflow_dispatch: null
permissions:
  contents: write
  id-token: write
  attestations: write
concurrency:
  group: shuvpn-release
  cancel-in-progress: false
jobs:
  build:
    name: Build android (${{ matrix.architecture }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        architecture:
          - arm64-v8a
          - armeabi-v7a
          - x86_64
          - universal
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Read and validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be created from the main branch."
            exit 1
          fi

          app_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
          if [[ ! "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?\+[0-9]+$ ]]; then
            echo "pubspec.yaml must contain a version such as 0.4.7+19."
            exit 1
          fi

          version_name="${app_version%%+*}"
          build_number="${app_version##*+}"
          release_tag="v${version_name}"

          tag_exists=false
          if git rev-parse --verify --quiet "refs/tags/${release_tag}" >/dev/null; then
            tag_exists=true
            tag_commit="$(git rev-list -n 1 "$release_tag")"
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "Tag ${release_tag} points to ${tag_commit}, not this commit (${GITHUB_SHA})."
              echo "Update pubspec.yaml before releasing changed code."
              exit 1
            fi
            echo "Tag ${release_tag} already points to this commit; it can be reused."
          fi

          echo "app_version=${app_version}" >> "$GITHUB_OUTPUT"
          echo "version_name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "tag_exists=${tag_exists}" >> "$GITHUB_OUTPUT"
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart and Flutter code
        run: flutter analyze
      - name: Run tests
        run: flutter test --concurrency=1
      - name: Restore Android signing files
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail

          if [[ -z "$ANDROID_KEYSTORE_BASE64" || \
                -z "$ANDROID_STORE_PASSWORD" || \
                -z "$ANDROID_KEY_PASSWORD" || \
                -z "$ANDROID_KEY_ALIAS" ]]; then
            echo "One or more Android signing secrets are missing."
            exit 1
          fi

          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > android/shuvpn-release.jks
          chmod 600 android/shuvpn-release.jks

          # storeFile is resolved against android/ (rootProject.file(...) in
          # android/app/build.gradle.kts), not against android/app.
          printf '%s\n' \
            "storePassword=$ANDROID_STORE_PASSWORD" \
            "keyPassword=$ANDROID_KEY_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "storeFile=shuvpn-release.jks" \
            > android/key.properties
          chmod 600 android/key.properties
      - name: Build and validate architecture
        shell: pwsh
        run: ./scripts/build_android.ps1 -Architecture "${{ matrix.architecture }}"
      - name: Verify the release signature
        shell: bash
        run: |
          set -euo pipefail

          # The release build silently falls back to the debug key when
          # key.properties is missing or blank, so without this check a
          # "release" could ship debug-signed and nothing would notice.
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [[ -z "$sdk" || ! -d "$sdk/build-tools" ]]; then
            echo "Android SDK build-tools not found (ANDROID_HOME is ${ANDROID_HOME:-unset})."
            exit 1
          fi

          apksigner="$(find "$sdk/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          if [[ -z "$apksigner" ]]; then
            echo "apksigner not found under $sdk/build-tools"
            exit 1
          fi

          for apk in build/release/*.apk; do
            echo "--- ${apk} ---"
            "$apksigner" verify --print-certs "$apk" | tee /tmp/certs.txt
            if grep -q "CN=Android Debug" /tmp/certs.txt; then
              echo "${apk} is signed with the debug key."
              exit 1
            fi
          done
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: build/release/*.apk
      - name: Upload architecture build
        uses: actions/upload-artifact@v7
        with:
          name: release-android-${{ matrix.architecture }}
          path: build/release/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing files
        if: always()
        run: |
          rm -f android/shuvpn-release.jks
          rm -f android/key.properties
  publish:
    needs: build
    uses: ./.github/workflows/publish-release.yml
    with:
      platform: android
    permissions:
      contents: write
