name: Windows Release
'on':
  workflow_dispatch: null
permissions:
  contents: write
  id-token: write
  attestations: write
concurrency:
  group: shuvpn-release
  cancel-in-progress: false
jobs:
  build:
    name: Build windows (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-latest
          - architecture: arm64
            runner: windows-11-arm
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Read and validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Releases must be created from the main branch."
            exit 1
          fi

          app_version="$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml | head -n 1)"
          if [[ ! "$app_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?\+[0-9]+$ ]]; then
            echo "pubspec.yaml must contain a version such as 0.4.7+19."
            exit 1
          fi

          version_name="${app_version%%+*}"
          build_number="${app_version##*+}"
          release_tag="v${version_name}"

          tag_exists=false
          if git rev-parse --verify --quiet "refs/tags/${release_tag}" >/dev/null; then
            tag_exists=true
            tag_commit="$(git rev-list -n 1 "$release_tag")"
            if [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "Tag ${release_tag} points to ${tag_commit}, not this commit (${GITHUB_SHA})."
              echo "Update pubspec.yaml before releasing changed code."
              exit 1
            fi
            echo "Tag ${release_tag} already points to this commit; it can be reused."
          fi

          echo "app_version=${app_version}" >> "$GITHUB_OUTPUT"
          echo "version_name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "build_number=${build_number}" >> "$GITHUB_OUTPUT"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
          echo "tag_exists=${tag_exists}" >> "$GITHUB_OUTPUT"
      - name: Set up Flutter
        uses: ./.github/actions/setup-flutter
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze Dart and Flutter code
        run: flutter analyze
      - name: Run tests
        run: flutter test --concurrency=1
      - name: Build and validate architecture
        shell: pwsh
        run: ./scripts/build_windows.ps1 -Architecture "${{ matrix.architecture }}"
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: build/release/*.zip
      - name: Upload architecture build
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-${{ matrix.architecture }}
          path: build/release/*.zip
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: build
    uses: ./.github/workflows/publish-release.yml
    with:
      platform: windows
    permissions:
      contents: write
